server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 320m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API do backend (mesmo domínio). /app/api evita conflito com NPM em /api.
    location = /app/api {
        return 301 /app/api/;
    }
    location /app/api/ {
        client_max_body_size 320m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://backend:3001/api/;
    }

    # Favicon legado
    location = /app/vite.svg {
        alias /usr/share/nginx/html/vite.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML do SPA: sem cache longo
    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        alias /usr/share/nginx/html/app/index.html;
    }

    # SPA React (build em /app/)
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location = /app {
        return 301 /app/;
    }

    # Atalhos sem prefixo /app/
    location = /login {
        return 302 /app/login;
    }
    location = /cadastro {
        return 302 /app/cadastro;
    }
    location ~ ^/conteudos/(palestrante|inscricao)/ {
        return 302 /app$request_uri;
    }

    # Landing estática na raiz
    location / {
        try_files $uri $uri/ /index.html;
    }
}

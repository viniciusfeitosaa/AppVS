# Override VPS COOPVITTA: nomes de containers, rede e sem portas publicadas no host.
#
# ⚠️ NÃO usar na VPS da Viva Saúde (187.77.247.33). Este ficheiro é só para a VPS
# dedicada da COOPVITTA (187.127.35.253). Na Viva Saúde suba apenas:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

services:
  backend:
    container_name: coopvitta-backend
    ports: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: coopvitta-frontend
    ports: !reset []

  postgres:
    container_name: coopvitta-postgres

  redis:
    container_name: coopvitta-redis

networks:
  app-network:
    name: coopvitta-network
    driver: bridge
